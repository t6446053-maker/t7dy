name: tahaddani
description: تحداني — لعبة أسئلة وتحدي جماعية بفرق ونقاط.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # تخزين محلي دائم على الجهاز (تسجيل الدخول محفوظ بدون Firebase)
  shared_preferences: ^2.2.3

  # تشفير كلمة المرور قبل حفظها محليًا
  crypto: ^3.0.3

  # خط عربي واضح غير مزخرف (Cairo)
  google_fonts: ^6.2.1

  # لجلب صور حقيقية لكل سؤال / موضوع من الإنترنت (API خارجي مجاني بدون مفتاح)
  http: ^1.2.1

  # عرض الصور القادمة من الإنترنت مع كاش وتحميل سلس
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
